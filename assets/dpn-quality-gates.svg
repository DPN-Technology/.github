 <g transform="translate(695 264)"><rect x="-72" y="-75" width="144" height="150" rx="18" fill="#0d0e12" stroke="#5edfff" stroke-opacity=".34"/><text y="-31" font-size="14" font-weight="850" fill="#fff">TEST</text><text y="-7" font-size="9" fill="#858b94">UNIT • INTEGRATION</text><text y="14" font-size="9" fill="#858b94">RUNTIME</text><text y="49" font-family="Consolas,monospace" font-size="8" fill="#70dbe9">GATE 04</text></g>
 <g transform="translate(880 264)"><rect x="-72" y="-75" width="144" height="150" rx="18" fill="#0d0e12" stroke="#ff5b13" stroke-opacity=".34"/><text y="-31" font-size="14" font-weight="850" fill="#fff">ARTIFACT</text><text y="-7" font-size="9" fill="#858b94">BUILD • HASH</text><text y="14" font-size="9" fill="#858b94">SBOM</text><text y="49" font-family="Consolas,monospace" font-size="8" fill="#d9855f">GATE 05</text></g>
