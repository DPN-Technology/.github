 <g transform="translate(1250 264)"><rect x="-72" y="-75" width="144" height="150" rx="18" fill="#0d0e12" stroke="#59d98e" stroke-opacity=".40"/><text y="-31" font-size="14" font-weight="850" fill="#fff">OPERATE</text><text y="-7" font-size="9" fill="#858b94">HEALTH • AUDIT</text><text y="14" font-size="9" fill="#858b94">RECOVERY</text><text y="49" font-family="Consolas,monospace" font-size="8" fill="#65d995">GATE 07</text></g>
