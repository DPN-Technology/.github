<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">DPN Quality Gates</title><desc id="desc">A sequence of architecture, code, security, test, artifact, release and operational gates.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#06070a"/><stop offset="1" stop-color="#10080b"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity=".024"/></pattern>
</defs>
<rect width="1400" height="520" rx="24" fill="url(#bg)"/><rect width="1400" height="520" rx="24" fill="url(#grid)"/>
<text x="70" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff5360" letter-spacing="4">QUALITY GATE SYSTEM</text>
<text x="70" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" fill="#f4f4f6">A change advances because evidence clears gates—not because a branch exists.</text>
<path d="M120 264H1280" stroke="#e50914" stroke-opacity=".20" stroke-width="2"/>
