<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="390" viewBox="0 0 1500 390" role="img" aria-labelledby="title desc">
<title id="title">DPN Build Loop</title><desc id="desc">Observe, design, build, verify, release and improve in the DPN binary-storm visual language.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#020304"/><stop offset=".55" stop-color="#08090d"/><stop offset="1" stop-color="#130508"/></linearGradient>
 <pattern id="bits" width="112" height="76" patternUnits="userSpaceOnUse"><text x="2" y="14" font-family="Consolas,monospace" font-size="10" fill="#e50914" fill-opacity=".09">01010110</text><text x="24" y="35" font-family="Consolas,monospace" font-size="9" fill="#ff3342" fill-opacity=".06">110011</text><text x="1" y="58" font-family="Consolas,monospace" font-size="10" fill="#e50914" fill-opacity=".08">00110101</text></pattern>
 <filter id="g"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1500" height="390" rx="24" fill="url(#bg)"/><rect width="1500" height="390" rx="24" fill="url(#bits)"/>
<path d="M1185 15 L1137 72 L1158 89 L1105 136 L1126 153 L1073 214" fill="none" stroke="#ff1f32" stroke-width="7" opacity=".18" filter="url(#g)"/><path d="M1185 15 L1137 72 L1158 89 L1105 136 L1126 153 L1073 214" fill="none" stroke="#ff2637" stroke-width="2.2" opacity=".62"/>
<text x="70" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="900" fill="#ff5966" letter-spacing="4">HOW DPN BUILDS</text>
<text x="70" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#f4f4f6">Engineering is a loop, not a handoff.</text>
<path d="M160 232H1340" stroke="#e50914" stroke-opacity=".24" stroke-width="2"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
 <g transform="translate(185 232)"><circle r="58" fill="#0d0e12" stroke="#e50914" stroke-opacity=".38"/><text y="-5" font-size="14" font-weight="850" fill="#fff">OBSERVE</text><text y="18" font-size="9" fill="#777c85">UNDERSTAND</text></g>
 <g transform="translate(410 232)"><circle r="58" fill="#0d0e12" stroke="#e50914" stroke-opacity=".34"/><text y="-5" font-size="14" font-weight="850" fill="#fff">DESIGN</text><text y="18" font-size="9" fill="#777c85">ARCHITECT</text></g>
 <g transform="translate(635 232)"><circle r="58" fill="#0d0e12" stroke="#e50914" stroke-opacity=".31"/><text y="-5" font-size="14" font-weight="850" fill="#fff">BUILD</text><text y="18" font-size="9" fill="#777c85">IMPLEMENT</text></g>
 <g transform="translate(860 232)"><circle r="58" fill="#0d0e12" stroke="#5edfff" stroke-opacity=".31"/><text y="-5" font-size="14" font-weight="850" fill="#fff">VERIFY</text><text y="18" font-size="9" fill="#777c85">PROVE</text></g>
 <g transform="translate(1085 232)"><circle r="58" fill="#0d0e12" stroke="#ff5b13" stroke-opacity=".34"/><text y="-5" font-size="14" font-weight="850" fill="#fff">RELEASE</text><text y="18" font-size="9" fill="#777c85">CONTROL</text></g>
 <g transform="translate(1310 232)"><circle r="58" fill="#0d0e12" stroke="#59d98e" stroke-opacity=".38"/><text y="-5" font-size="14" font-weight="850" fill="#fff">IMPROVE</text><text y="18" font-size="9" fill="#777c85">FEEDBACK</text></g>
</g>
<g fill="#e50914" opacity=".5"><path d="M255 226l20 6-20 6z"/><path d="M480 226l20 6-20 6z"/><path d="M705 226l20 6-20 6z"/><path d="M930 226l20 6-20 6z"/><path d="M1155 226l20 6-20 6z"/></g>
