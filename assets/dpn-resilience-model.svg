<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
<title id="title">DPN Resilience Model</title><desc id="desc">Normal, degraded, isolated, recovery and restored operating states.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#06070a"/><stop offset="1" stop-color="#10080b"/></linearGradient></defs>
<rect width="1400" height="470" rx="24" fill="url(#bg)"/>
<text x="70" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff5360" letter-spacing="4">RESILIENCE MODEL</text>
<text x="70" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#f4f4f6">Failure should change state—not erase control.</text>

<g font-family="Segoe UI,Arial,sans-serif">
 <g transform="translate(78 155)"><rect width="220" height="150" rx="18" fill="#0d0e12" stroke="#59d98e" stroke-opacity=".36"/><text x="20" y="36" font-size="17" font-weight="850" fill="#fff">NORMAL</text><text x="20" y="69" font-size="11" fill="#858b94">All expected services</text><text x="20" y="91" font-size="11" fill="#858b94">available and healthy.</text><text x="20" y="124" font-family="Consolas,monospace" font-size="9" fill="#65d995">OPERATE</text></g>
 <g transform="translate(334 155)"><rect width="220" height="150" rx="18" fill="#0d0e12" stroke="#f0b24b" stroke-opacity=".36"/><text x="20" y="36" font-size="17" font-weight="850" fill="#fff">DEGRADED</text><text x="20" y="69" font-size="11" fill="#858b94">Reduced capability,</text><text x="20" y="91" font-size="11" fill="#858b94">controlled limitations.</text><text x="20" y="124" font-family="Consolas,monospace" font-size="9" fill="#d9aa5d">CONTAIN</text></g>
 <g transform="translate(590 155)"><rect width="220" height="150" rx="18" fill="#0d0e12" stroke="#e50914" stroke-opacity=".42"/><text x="20" y="36" font-size="17" font-weight="850" fill="#fff">ISOLATED</text><text x="20" y="69" font-size="11" fill="#858b94">Fault boundary enforced,</text><text x="20" y="91" font-size="11" fill="#858b94">high-risk actions blocked.</text><text x="20" y="124" font-family="Consolas,monospace" font-size="9" fill="#ff6571">PROTECT</text></g>
 <g transform="translate(846 155)"><rect width="220" height="150" rx="18" fill="#0d0e12" stroke="#5edfff" stroke-opacity=".34"/><text x="20" y="36" font-size="17" font-weight="850" fill="#fff">RECOVERY</text><text x="20" y="69" font-size="11" fill="#858b94">Rollback, restore or</text><text x="20" y="91" font-size="11" fill="#858b94">rebuild under control.</text><text x="20" y="124" font-family="Consolas,monospace" font-size="9" fill="#70dbe9">RESTORE</text></g>
 <g transform="translate(1102 155)"><rect width="220" height="150" rx="18" fill="#0d0e12" stroke="#9b5cff" stroke-opacity=".36"/><text x="20" y="36" font-size="17" font-weight="850" fill="#fff">RESTORED</text><text x="20" y="69" font-size="11" fill="#858b94">Evidence reviewed,</text><text x="20" y="91" font-size="11" fill="#858b94">service returned safely.</text><text x="20" y="124" font-family="Consolas,monospace" font-size="9" fill="#a98be0">VERIFY</text></g>
</g>

<path d="M298 230H334M554 230H590M810 230H846M1066 230H1102" stroke="#e50914" stroke-opacity=".24" stroke-width="2"/>
<g fill="#e50914" opacity=".48"><path d="M316 224l18 6-18 6z"/><path d="M572 224l18 6-18 6z"/><path d="M828 224l18 6-18 6z"/><path d="M1084 224l18 6-18 6z"/></g>

<g transform="translate(235 350)">
 <rect width="930" height="62" rx="12" fill="#0d0e12" stroke="#e50914" stroke-opacity=".18"/>
 <text x="465" y="38" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#737983" letter-spacing="1.2">VISIBLE STATE • BOUNDED AUTHORITY • PRESERVED EVIDENCE • DELIBERATE RETURN</text>
</g>
<rect x="1" y="1" width="1398" height="468" rx="23" fill="none" stroke="#e50914" stroke-opacity=".14"/>
</svg>