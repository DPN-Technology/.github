<g font-family="Segoe UI,Arial,sans-serif">
 <g transform="translate(80 145)"><rect width="520" height="165" rx="18" fill="#0d0e12" stroke="#e50914" stroke-opacity=".28"/><rect width="5" height="165" rx="2.5" fill="#e50914"/><text x="30" y="40" font-size="19" font-weight="850" fill="#fff">CONTROL &amp; INFRASTRUCTURE</text><text x="30" y="76" font-size="12" fill="#9297a0">Visibility • identity • monitoring • automation</text><text x="30" y="100" font-size="12" fill="#9297a0">networking • endpoint control • recovery</text><text x="30" y="136" font-family="Consolas,monospace" font-size="10" fill="#ff6571">OPERATE • OBSERVE • PROTECT • RESTORE</text></g>
