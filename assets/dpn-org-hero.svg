    <text x="30" y="76" font-family="Consolas,monospace" font-size="10" fill="#ff5360" fill-opacity=".08">11001</text>
  </pattern>
  <filter id="redGlow"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="boltGlow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>

