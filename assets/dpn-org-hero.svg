<text x="78" y="446" font-family="Consolas,monospace" font-size="12" font-weight="800" fill="#6c7079" letter-spacing="2.2">DPN://ORGANIZATION • BUILDING THE OPERATING LAYER BETWEEN PEOPLE, SOFTWARE, SYSTEMS &amp; AUTOMATION</text>
