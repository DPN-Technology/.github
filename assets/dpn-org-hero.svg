<text x="78" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="900" fill="#f8f8fa">Develop. Pioneer. Navigate.</text>
<text x="78" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#a4a7b0">We Develop what doesn’t exist. We Pioneer what comes next. We Navigate the future.</text>
<text x="78" y="282" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#7f838d">Software • Infrastructure • AI • Automation • Operations • Interactive Systems</text>

