  <radialGradient id="coreGlow" cx=".72" cy=".43" r=".55"><stop stop-color="#e50914" stop-opacity=".32"/><stop offset=".6" stop-color="#7a0710" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7b84"/><stop offset=".32" stop-color="#ff1f32"/><stop offset="1" stop-color="#7a0710"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".022"/></pattern>
  <pattern id="binary" width="98" height="84" patternUnits="userSpaceOnUse">
