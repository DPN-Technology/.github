<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">DPN Reliability Model</title><desc id="desc">Service objectives, health signals, error budgets, degradation and recovery.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#06070a"/><stop offset="1" stop-color="#10080b"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity=".024"/></pattern>
</defs>
<rect width="1400" height="500" rx="24" fill="url(#bg)"/><rect width="1400" height="500" rx="24" fill="url(#grid)"/>
<text x="70" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff5360" letter-spacing="4">RELIABILITY OPERATING MODEL</text>
<text x="70" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" fill="#f4f4f6">Reliability is an observable contract between users, systems and operators.</text>
<g transform="translate(80 138)" font-family="Segoe UI,Arial,sans-serif">
 <g><rect width="280" height="145" rx="18" fill="#0d0e12" stroke="#5edfff" stroke-opacity=".30"/><text x="22" y="36" font-size="16" font-weight="850" fill="#fff">SERVICE OBJECTIVES</text><text x="22" y="67" font-size="11" fill="#858b94">Availability • latency</text><text x="22" y="89" font-size="11" fill="#858b94">freshness • correctness</text><text x="22" y="120" font-family="Consolas,monospace" font-size="9" fill="#70dbe9">WHAT GOOD LOOKS LIKE</text></g>
 <g transform="translate(320 0)"><rect width="280" height="145" rx="18" fill="#0d0e12" stroke="#9b5cff" stroke-opacity=".30"/><text x="22" y="36" font-size="16" font-weight="850" fill="#fff">HEALTH SIGNALS</text><text x="22" y="67" font-size="11" fill="#858b94">Metrics • logs • traces</text><text x="22" y="89" font-size="11" fill="#858b94">synthetics • audits</text><text x="22" y="120" font-family="Consolas,monospace" font-size="9" fill="#a88add">HOW WE KNOW</text></g>
 <g transform="translate(640 0)"><rect width="280" height="145" rx="18" fill="#0d0e12" stroke="#f0b24b" stroke-opacity=".32"/><text x="22" y="36" font-size="16" font-weight="850" fill="#fff">ERROR BUDGET</text><text x="22" y="67" font-size="11" fill="#858b94">Allowed failure • risk</text><text x="22" y="89" font-size="11" fill="#858b94">change velocity</text><text x="22" y="120" font-family="Consolas,monospace" font-size="9" fill="#d9aa5d">HOW MUCH RISK</text></g>
 <g transform="translate(960 0)"><rect width="280" height="145" rx="18" fill="#0d0e12" stroke="#e50914" stroke-opacity=".36"/><text x="22" y="36" font-size="16" font-weight="850" fill="#fff">DEGRADATION</text><text x="22" y="67" font-size="11" fill="#858b94">Fallbacks • limits</text><text x="22" y="89" font-size="11" fill="#858b94">load shedding</text><text x="22" y="120" font-family="Consolas,monospace" font-size="9" fill="#ff6571">HOW WE FAIL</text></g>
</g>
<g transform="translate(225 330)">
 <rect width="950" height="94" rx="16" fill="#0d0e12" stroke="#59d98e" stroke-opacity=".28"/>
 <text x="28" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="850" fill="#fff">RECOVERY + LEARNING LOOP</text>
 <text x="28" y="66" font-family="Consolas,monospace" font-size="10" fill="#7f858e">RESTORE • VERIFY • REVIEW • HARDEN • UPDATE OBJECTIVES</text>
</g>
<g stroke="#e50914" stroke-opacity=".22" stroke-width="2" fill="none"><path d="M360 284v46M680 284v46M1000 284v46M1240 284Q1240 377 1175 377"/></g>
<text x="70" y="468" font-family="Consolas,monospace" font-size="10" fill="#6f747d" letter-spacing="1.2">IF HEALTH CANNOT BE OBSERVED, RELIABILITY CANNOT BE MANAGED</text>
<rect x="1" y="1" width="1398" height="498" rx="23" fill="none" stroke="#e50914" stroke-opacity=".14"/>
</svg>