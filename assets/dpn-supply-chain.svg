<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">DPN Software Supply Chain</title><desc id="desc">Source, dependency, build, signing, artifact and deployment trust flow.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07080b"/><stop offset="1" stop-color="#0f080b"/></linearGradient></defs>
<rect width="1400" height="500" rx="24" fill="url(#bg)"/>
<text x="70" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff5360" letter-spacing="4">SOFTWARE SUPPLY CHAIN</text>
<text x="70" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" fill="#f4f4f6">Trust is carried from source to deployed artifact through explicit evidence.</text>
<g font-family="Segoe UI,Arial,sans-serif">
 <g transform="translate(82 155)"><rect width="190" height="176" rx="18" fill="#0d0e12" stroke="#9b5cff" stroke-opacity=".34"/><text x="20" y="36" font-size="16" font-weight="850" fill="#fff">SOURCE</text><text x="20" y="68" font-size="10" fill="#858b94">Reviewed code</text><text x="20" y="90" font-size="10" fill="#858b94">Protected branches</text><text x="20" y="112" font-size="10" fill="#858b94">Tracked provenance</text><text x="20" y="148" font-family="Consolas,monospace" font-size="8" fill="#a88add">COMMIT SHA</text></g>
 <g transform="translate(300 155)"><rect width="190" height="176" rx="18" fill="#0d0e12" stroke="#e50914" stroke-opacity=".34"/><text x="20" y="36" font-size="16" font-weight="850" fill="#fff">DEPEND</text><text x="20" y="68" font-size="10" fill="#858b94">Pinned versions</text><text x="20" y="90" font-size="10" fill="#858b94">License record</text><text x="20" y="112" font-size="10" fill="#858b94">Vulnerability review</text><text x="20" y="148" font-family="Consolas,monospace" font-size="8" fill="#ff6571">SBOM / NOTICES</text></g>
 <g transform="translate(518 155)"><rect width="190" height="176" rx="18" fill="#0d0e12" stroke="#5edfff" stroke-opacity=".34"/><text x="20" y="36" font-size="16" font-weight="850" fill="#fff">BUILD</text><text x="20" y="68" font-size="10" fill="#858b94">Controlled inputs</text><text x="20" y="90" font-size="10" fill="#858b94">Repeatable steps</text><text x="20" y="112" font-size="10" fill="#858b94">Build evidence</text><text x="20" y="148" font-family="Consolas,monospace" font-size="8" fill="#70dbe9">BUILD ID</text></g>
 <g transform="translate(736 155)"><rect width="190" height="176" rx="18" fill="#0d0e12" stroke="#ff5b13" stroke-opacity=".34"/><text x="20" y="36" font-size="16" font-weight="850" fill="#fff">SIGN</text><text x="20" y="68" font-size="10" fill="#858b94">Artifact integrity</text><text x="20" y="90" font-size="10" fill="#858b94">Authority separation</text><text x="20" y="112" font-size="10" fill="#858b94">Verification path</text><text x="20" y="148" font-family="Consolas,monospace" font-size="8" fill="#d9855f">SIGNATURE</text></g>
 <g transform="translate(954 155)"><rect width="190" height="176" rx="18" fill="#0d0e12" stroke="#f0b24b" stroke-opacity=".34"/><text x="20" y="36" font-size="16" font-weight="850" fill="#fff">RELEASE</text><text x="20" y="68" font-size="10" fill="#858b94">Versioned artifact</text><text x="20" y="90" font-size="10" fill="#858b94">Checksums</text><text x="20" y="112" font-size="10" fill="#858b94">Known limits</text><text x="20" y="148" font-family="Consolas,monospace" font-size="8" fill="#d9aa5d">RELEASE RECORD</text></g>
 <g transform="translate(1172 155)"><rect width="146" height="176" rx="18" fill="#0d0e12" stroke="#59d98e" stroke-opacity=".40"/><text x="18" y="36" font-size="16" font-weight="850" fill="#fff">VERIFY</text><text x="18" y="68" font-size="10" fill="#858b94">Hash</text><text x="18" y="90" font-size="10" fill="#858b94">Signature</text><text x="18" y="112" font-size="10" fill="#858b94">Source link</text><text x="18" y="148" font-family="Consolas,monospace" font-size="8" fill="#65d995">TRUST DECISION</text></g>
</g>
