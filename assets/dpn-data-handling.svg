<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510" role="img" aria-labelledby="title desc">
<title id="title">DPN Data Handling Model</title><desc id="desc">Data classification from public through sensitive with matching controls.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07080b"/><stop offset="1" stop-color="#10080b"/></linearGradient></defs>
<rect width="1400" height="510" rx="24" fill="url(#bg)"/>
<text x="70" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff5360" letter-spacing="4">DATA HANDLING MODEL</text>
<text x="70" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" fill="#f4f4f6">Controls should follow the sensitivity and operational value of the data.</text>
<g font-family="Segoe UI,Arial,sans-serif">
 <g transform="translate(80 145)"><rect width="285" height="250" rx="20" fill="#0d0e12" stroke="#59d98e" stroke-opacity=".34"/><text x="22" y="38" font-size="17" font-weight="850" fill="#fff">PUBLIC</text><text x="22" y="72" font-size="11" fill="#858b94">Intended for external use</text><text x="22" y="112" font-family="Consolas,monospace" font-size="9" fill="#65d995">CONTROLS</text><text x="22" y="138" font-size="10" fill="#858b94">Integrity • provenance</text><text x="22" y="160" font-size="10" fill="#858b94">review • licensing</text><text x="22" y="198" font-family="Consolas,monospace" font-size="9" fill="#65d995">EXAMPLE</text><text x="22" y="222" font-size="10" fill="#858b94">Public docs / releases</text></g>
 <g transform="translate(385 145)"><rect width="285" height="250" rx="20" fill="#0d0e12" stroke="#5edfff" stroke-opacity=".30"/><text x="22" y="38" font-size="17" font-weight="850" fill="#fff">INTERNAL</text><text x="22" y="72" font-size="11" fill="#858b94">Routine non-public operations</text><text x="22" y="112" font-family="Consolas,monospace" font-size="9" fill="#70dbe9">CONTROLS</text><text x="22" y="138" font-size="10" fill="#858b94">Authenticated access</text><text x="22" y="160" font-size="10" fill="#858b94">retention • audit</text><text x="22" y="198" font-family="Consolas,monospace" font-size="9" fill="#70dbe9">EXAMPLE</text><text x="22" y="222" font-size="10" fill="#858b94">Internal project data</text></g>
 <g transform="translate(690 145)"><rect width="285" height="250" rx="20" fill="#0d0e12" stroke="#f0b24b" stroke-opacity=".32"/><text x="22" y="38" font-size="17" font-weight="850" fill="#fff">RESTRICTED</text><text x="22" y="72" font-size="11" fill="#858b94">Material operational data</text><text x="22" y="112" font-family="Consolas,monospace" font-size="9" fill="#d9aa5d">CONTROLS</text><text x="22" y="138" font-size="10" fill="#858b94">Least privilege • encryption</text><text x="22" y="160" font-size="10" fill="#858b94">audit • export limits</text><text x="22" y="198" font-family="Consolas,monospace" font-size="9" fill="#d9aa5d">EXAMPLE</text><text x="22" y="222" font-size="10" fill="#858b94">Operational / customer data</text></g>
 <g transform="translate(995 145)"><rect width="325" height="250" rx="20" fill="#0d0e12" stroke="#e50914" stroke-opacity=".40"/><text x="22" y="38" font-size="17" font-weight="850" fill="#fff">SENSITIVE / SECRET</text><text x="22" y="72" font-size="11" fill="#858b94">High-impact or credential material</text><text x="22" y="112" font-family="Consolas,monospace" font-size="9" fill="#ff6571">CONTROLS</text><text x="22" y="138" font-size="10" fill="#858b94">Strong auth • encryption</text><text x="22" y="160" font-size="10" fill="#858b94">segmentation • rotation</text><text x="22" y="182" font-size="10" fill="#858b94">minimal retention</text><text x="22" y="220" font-family="Consolas,monospace" font-size="9" fill="#ff6571">EXAMPLE</text><text x="22" y="244" font-size="10" fill="#858b94">Keys • tokens • recovery secrets</text></g>
</g>
<text x="70" y="461" font-family="Consolas,monospace" font-size="10" fill="#6f747d" letter-spacing="1.15">CLASSIFY FIRST • THEN DEFINE ACCESS • STORAGE • RETENTION • EXPORT • RECOVERY</text>
<rect x="1" y="1" width="1398" height="508" rx="23" fill="none" stroke="#e50914" stroke-opacity=".14"/>
</svg>