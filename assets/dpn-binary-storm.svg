<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="260" viewBox="0 0 1500 260" role="img" aria-labelledby="title desc">
<title id="title">DPN Binary Storm</title><desc id="desc">DPN black and red binary rain with lightning and command-grid energy.</desc>
