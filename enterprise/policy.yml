version: 1
enterprise:
  name: DPN Enterprise
  organization: DPN-Technology
  governance_model: centralized
  default_mode: audit
  target_mode: enforce

defaults:
  repository_visibility:
    allowed:
      - private
      - internal
      - public
    preferred: private
  base_permission: read
  default_branch: main
  actions:
    enabled: true
    workflow_permissions: read
    allow_fork_pr_write_tokens: false
    allow_approval_bypass: false
    require_sha_pinning: true
    allow_pull_request_target: false
  pull_requests:
    required: true
    require_conversation_resolution: true
    require_status_checks: true
    dismiss_stale_reviews: true
  branches:
    block_force_push: true
    block_deletion: true
  releases:
    provenance_required_for_distributables: true
    checksums_required: true
    dependency_record_required: true
  access:
    prefer_teams_over_direct_grants: true
    minimize_repository_admins: true
    fine_grained_pat_approval: required
    classic_pat_policy: restrict_when_migration_complete

tiers:
  critical:
    description: Identity, control plane, infrastructure, security, privileged operations, or sensitive workforce systems.
    required:
      codeowners: true
      pr_template: true
      security_policy: true
      dependency_record: true
      explicit_workflow_permissions: true
      sha_pinned_actions: true
      enterprise_gate_mode: enforce
      release_attestation: true
    review:
      minimum_approvals: 1
      owner_review: true
  elevated:
    description: Business-critical applications, network tooling, operating systems, service operations, or data-bearing systems.
    required:
      codeowners: true
      pr_template: true
      security_policy: true
      dependency_record: true
      explicit_workflow_permissions: true
      sha_pinned_actions: true
      enterprise_gate_mode: enforce
      release_attestation: true
    review:
      minimum_approvals: 1
      owner_review: false
  standard:
    description: Public sites, games, simulations, scripts, and lower-risk applications.
    required:
      codeowners: false
      pr_template: true
      security_policy: true
      dependency_record: false
      explicit_workflow_permissions: true
      sha_pinned_actions: true
      enterprise_gate_mode: enforce
      release_attestation: false
    review:
      minimum_approvals: 0
      owner_review: false
  experimental:
    description: Prototypes and exploratory repositories.
    required:
      codeowners: false
      pr_template: false
      security_policy: true
      dependency_record: false
      explicit_workflow_permissions: true
      sha_pinned_actions: true
      enterprise_gate_mode: audit
      release_attestation: false
    review:
      minimum_approvals: 0
      owner_review: false

custom_properties:
  - name: dpn_product
    type: string
    required: true
  - name: lifecycle
    type: single_select
    required: true
    values: [concept, prototype, development, preview, release, maintenance, retired]
  - name: governance_tier
    type: single_select
    required: true
    values: [critical, elevated, standard, experimental]
  - name: criticality
    type: single_select
    required: true
    values: [tier-1, tier-2, tier-3, experimental]
  - name: clearance
    type: single_select
    required: true
    values: [L1-GREEN, L2-YELLOW, L3-RED, L4-PURPLE]
  - name: component
    type: single_select
    required: true
    values: [application, service, infrastructure, website, library, simulation, agent, documentation, control-plane]
  - name: customer_facing
    type: boolean
    required: true
  - name: release_channel
    type: single_select
    required: true
    values: [dev, beta, stable, none]
  - name: security_tier
    type: single_select
    required: true
    values: [baseline, elevated, critical]
