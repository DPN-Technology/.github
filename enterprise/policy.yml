version: 1
enterprise:
  name: DPN Enterprise
  organization: DPN-Technology
  governance_model: centralized
  default_mode: audit
  target_mode: enforce
  governance_sources:
    public_policy: DPN-Technology/.github
    internal_inventory: private-operational-inventory
  required_workflows:
    baseline: .github/workflows/dpn-enterprise-ruleset.yml
    elevated: .github/workflows/dpn-enterprise-elevated-ruleset.yml
    critical: .github/workflows/dpn-enterprise-critical-ruleset.yml
    public_surface: .github/workflows/dpn-enterprise-public-ruleset.yml

defaults:
  repository_visibility:
    allowed:
      - private
      - internal
      - public
    preferred: private
  base_permission: read
  default_branch: main
  actions:
    enabled: true
    workflow_permissions: read
    allow_fork_pr_write_tokens: false
    allow_approval_bypass: false
    require_sha_pinning: true
    allow_pull_request_target: false
  pull_requests:
    required: true
    require_conversation_resolution: true
    require_status_checks: true
    dismiss_stale_reviews: true
  branches:
    block_force_push: true
    block_deletion: true
  releases:
    provenance_required_for_distributables: true
    checksums_required: true
    dependency_record_required: true
  access:
    prefer_teams_over_direct_grants: true
    minimize_repository_admins: true
    fine_grained_pat_approval: required
    classic_pat_policy: restrict_when_migration_complete

tiers:
  critical:
    description: Identity, control plane, infrastructure, security, privileged operations, or sensitive workforce systems.
    required:
      codeowners: true
      pr_template: true
      security_policy: true
      dependency_record: true
      explicit_workflow_permissions: true
      sha_pinned_actions: true
      enterprise_gate_mode: enforce
      release_attestation: true
    review:
      minimum_approvals: 1
      owner_review: true
  elevated:
    description: Business-critical applications, network tooling, operating systems, service operations, or data-bearing systems.
    required:
      codeowners: true
      pr_template: true
      security_policy: true
      dependency_record: true
      explicit_workflow_permissions: true
      sha_pinned_actions: true
      enterprise_gate_mode: enforce
      release_attestation: true
    review:
      minimum_approvals: 1
      owner_review: false
  standard:
    description: Public sites, games, simulations, scripts, and lower-risk applications.
    required:
      codeowners: false
      pr_template: true
      security_policy: true
      dependency_record: false
      explicit_workflow_permissions: true
      sha_pinned_actions: true
      enterprise_gate_mode: enforce
      release_attestation: false
    review:
      minimum_approvals: 0
      owner_review: false
  experimental:
    description: Prototypes and exploratory repositories.
    required:
      codeowners: false
      pr_template: false
      security_policy: true
      dependency_record: false
      explicit_workflow_permissions: true
      sha_pinned_actions: true
      enterprise_gate_mode: audit
      release_attestation: false
    review:
      minimum_approvals: 0
      owner_review: false

custom_properties:
  - property_name: dpn_product
    value_type: string
    required: true
    description: Canonical DPN product or system identity.
    values_editable_by: org_actors
    require_explicit_values: true

  - property_name: lifecycle
    value_type: single_select
    required: true
    description: Current evidence-backed engineering lifecycle.
    allowed_values: [concept, prototype, development, preview, release, maintenance, retired]
    values_editable_by: org_actors
    require_explicit_values: true

  - property_name: governance_tier
    value_type: single_select
    required: true
    description: DPN Enterprise policy tier used for ruleset targeting.
    allowed_values: [critical, elevated, standard, experimental]
    values_editable_by: org_actors
    require_explicit_values: true

  - property_name: criticality
    value_type: single_select
    required: true
    description: Operational criticality of the repository.
    allowed_values: [tier-1, tier-2, tier-3, experimental]
    values_editable_by: org_actors
    require_explicit_values: true

  - property_name: clearance
    value_type: single_select
    required: true
    description: DPN information classification.
    allowed_values: [L1-GREEN, L2-YELLOW, L3-RED, L4-PURPLE]
    values_editable_by: org_actors
    require_explicit_values: true

  - property_name: component
    value_type: single_select
    required: true
    description: Primary engineering component type.
    allowed_values: [application, service, infrastructure, website, library, simulation, agent, documentation, control-plane]
    values_editable_by: org_actors
    require_explicit_values: true

  - property_name: customer_facing
    value_type: true_false
    required: true
    description: Whether external users or customers directly depend on the repository.
    values_editable_by: org_actors
    require_explicit_values: true

  - property_name: release_channel
    value_type: single_select
    required: true
    description: Current release channel.
    allowed_values: [dev, beta, stable, none]
    values_editable_by: org_actors
    require_explicit_values: true

  - property_name: security_tier
    value_type: single_select
    required: true
    description: Security control tier.
    allowed_values: [baseline, elevated, critical]
    values_editable_by: org_actors
    require_explicit_values: true
