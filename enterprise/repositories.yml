version: 2
organization: DPN-Technology
classification_status: public-safe-enterprise-summary
privacy:
  publish_private_repository_names: false
  internal_inventory_location: private-operational-inventory
  note: Private and internal repository identities are intentionally excluded from the public .github control plane.

estate:
  governed_repositories: 20
  visibility:
    public: 5
    private_or_internal: 15
  governance_tier:
    critical: 8
    elevated: 5
    standard: 7
    experimental: 0
  clearance:
    L4-PURPLE: 3
    L3-RED: 7
    L2-YELLOW: 2
    L1-GREEN: 8

public_repositories:
  - name: .github
    dpn_product: .github
    lifecycle: development
    visibility: public
    governance_tier: critical
    criticality: tier-1
    clearance: L1-GREEN
    component: control-plane
    customer_facing: true
    release_channel: none
    security_tier: critical

  - name: DPN-Technology.github.io
    dpn_product: DPN-Technology.github.io
    lifecycle: release
    visibility: public
    governance_tier: standard
    criticality: tier-3
    clearance: L1-GREEN
    component: website
    customer_facing: true
    release_channel: stable
    security_tier: baseline

  - name: DPN-QB-FiveM-Scripts
    dpn_product: DPN-QB-FiveM-Scripts
    lifecycle: development
    visibility: public
    governance_tier: standard
    criticality: tier-3
    clearance: L1-GREEN
    component: library
    customer_facing: true
    release_channel: dev
    security_tier: baseline

  - name: DPN-War-Simulator
    dpn_product: DPN-War-Simulator
    lifecycle: development
    visibility: public
    governance_tier: standard
    criticality: tier-3
    clearance: L1-GREEN
    component: simulation
    customer_facing: true
    release_channel: dev
    security_tier: baseline

  - name: DreamBound-Adventures
    dpn_product: DreamBound-Adventures
    lifecycle: development
    visibility: public
    governance_tier: standard
    criticality: tier-3
    clearance: L1-GREEN
    component: application
    customer_facing: true
    release_channel: dev
    security_tier: baseline

required_property_schema:
  - dpn_product
  - lifecycle
  - governance_tier
  - criticality
  - clearance
  - component
  - customer_facing
  - release_channel
  - security_tier
