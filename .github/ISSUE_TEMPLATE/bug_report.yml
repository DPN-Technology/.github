name: Bug report
description: Report a reproducible problem in a public DPN project
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include secrets or security-sensitive exploit details here.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v1.2.3 or commit SHA"
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots or test output with secrets removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets and sensitive data.
          required: true
        - label: This is not a vulnerability report.
          required: true
