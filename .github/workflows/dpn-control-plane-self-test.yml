name: DPN Control Plane Self-Test

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/workflow-templates/**"
      - ".github/VULNERABILITY_REPORT.yml"
      - "CONTROL_PLANE.md"
      - "GREEN_GATE_STANDARD.md"
      - "REPOSITORY_METADATA_STANDARD.md"
      - "enterprise/**"
      - "templates/**"
      - "THIRD_PARTY_LICENSES.md"
      - "README.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/workflow-templates/**"
      - ".github/VULNERABILITY_REPORT.yml"
      - "CONTROL_PLANE.md"
      - "GREEN_GATE_STANDARD.md"
      - "REPOSITORY_METADATA_STANDARD.md"
      - "enterprise/**"
      - "templates/**"
      - "THIRD_PARTY_LICENSES.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green-gate-contract:
    uses: ./.github/workflows/dpn-green-gate.yml
    with:
      lifecycle: release
      enterprise_mode: audit
      governance_tier: critical
      require_security_policy: true
      require_dependency_record: true
      require_runbook: false
      require_codeowners: true
      require_pr_template: true
      require_action_sha_pinning: true
      require_explicit_workflow_permissions: true

  reusable-ci-contract:
    uses: ./.github/workflows/dpn-reusable-ci.yml
    with:
      working_directory: .
      timeout_minutes: 10

  enterprise-policy-contract:
    name: Enterprise Policy Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Enterprise source of truth
        shell: bash
        run: |
          set -euo pipefail
          test -s enterprise/OVERVIEW.md
          test -s enterprise/policy.yml
          test -s enterprise/repositories.yml
          test -s enterprise/rulesets.yml
          test -s enterprise/RULESETS.md
          test -s enterprise/ACTIONS_POLICY.md
          test -s enterprise/ACCESS_MODEL.md
          test -s enterprise/CUSTOM_PROPERTIES.md
          test -s enterprise/SECURITY_ROLLOUT.md
          test -s enterprise/ADMIN_ACTIVATION.md
          test -s enterprise/EFFECTIVE_STATE.md
          test -s THIRD_PARTY_LICENSES.md
          test -s .github/workflows/dpn-enterprise-ruleset.yml
          test -s .github/workflows/dpn-enterprise-elevated-ruleset.yml
          test -s .github/workflows/dpn-enterprise-critical-ruleset.yml
          test -s .github/workflows/dpn-enterprise-public-ruleset.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          overview = Path("enterprise/OVERVIEW.md").read_text(encoding="utf-8")
          policy = Path("enterprise/policy.yml").read_text(encoding="utf-8")
          repos = Path("enterprise/repositories.yml").read_text(encoding="utf-8")
          rulesets = Path("enterprise/rulesets.yml").read_text(encoding="utf-8")

          for required_text in [
              "DPN Enterprise // Control Plane",
              "DPN Governance Estate",
              "Ruleset Stack",
              "Enforcement Workflow Matrix",
              "Source vs. Effective State",
              "Enterprise Quick Access",
              "Enterprise Health Definition",
              "Effective State Register",
              "Rollout State",
          ]:
              if required_text not in overview:
                  raise SystemExit(f"Enterprise Overview missing required section: {required_text}")

          if "raw.githubusercontent.com/DPN-Technology/.github/main/assets/" not in overview:
              raise SystemExit("Enterprise Overview must use publicly hosted DPN visual assets")

          required_props = {
              "dpn_product", "lifecycle", "governance_tier", "criticality",
              "clearance", "component", "customer_facing",
              "release_channel", "security_tier"
          }
          found = set(re.findall(r"^\s*- name:\s*([A-Za-z0-9_$#-]+)\s*$", policy, re.M))
          missing = sorted(required_props - found)
          if missing:
              raise SystemExit(f"Missing Enterprise property definitions: {missing}")

          required_workflows = {
              ".github/workflows/dpn-enterprise-ruleset.yml",
              ".github/workflows/dpn-enterprise-elevated-ruleset.yml",
              ".github/workflows/dpn-enterprise-critical-ruleset.yml",
              ".github/workflows/dpn-enterprise-public-ruleset.yml",
          }
          absent_policy_workflows = sorted(x for x in required_workflows if x not in policy)
          if absent_policy_workflows:
              raise SystemExit(f"Policy missing required-workflow bindings: {absent_policy_workflows}")

          for rule_id in ("E0", "E1", "E2", "E3"):
              if f"id: {rule_id}" not in rulesets:
                  raise SystemExit(f"Machine-readable rulesets missing {rule_id}")
          absent_ruleset_workflows = sorted(x for x in required_workflows if x not in rulesets)
          if absent_ruleset_workflows:
              raise SystemExit(f"rulesets.yml missing workflow bindings: {absent_ruleset_workflows}")

          if "publish_private_repository_names: false" not in repos:
              raise SystemExit("Public repository summary must explicitly disable private repository name publication")
          if re.search(r"(?m)^\s+visibility:\s*private\s*$", repos):
              raise SystemExit("Public Enterprise repository summary contains a private repository entry")

          def count(label):
              m = re.search(rf"(?m)^\s{{4}}{re.escape(label)}:\s*(\d+)\s*$", repos)
              if not m:
                  raise SystemExit(f"Missing estate count: {label}")
              return int(m.group(1))

          governed_match = re.search(r"(?m)^\s{2}governed_repositories:\s*(\d+)\s*$", repos)
          if not governed_match:
              raise SystemExit("Missing governed_repositories count")
          governed = int(governed_match.group(1))

          expected_counts = {
              "governed": governed,
              "critical": count("critical"),
              "elevated": count("elevated"),
              "standard": count("standard"),
              "experimental": count("experimental"),
              "L4-PURPLE": count("L4-PURPLE"),
              "L3-RED": count("L3-RED"),
              "L2-YELLOW": count("L2-YELLOW"),
              "L1-GREEN": count("L1-GREEN"),
          }

          public_section = repos.split("public_repositories:", 1)
          if len(public_section) != 2:
              raise SystemExit("Missing public_repositories section")
          public_blocks = re.split(r"(?m)^  - name:\s*", public_section[1])[1:]
          if len(public_blocks) != 5:
              raise SystemExit(f"Expected 5 public repository records, found {len(public_blocks)}")

          for block in public_blocks:
              name = block.splitlines()[0].strip()
              for prop in required_props:
                  if not re.search(rf"(?m)^\s{{4}}{re.escape(prop)}:\s*.+$", block):
                      raise SystemExit(f"Public repository {name} missing required property {prop}")

          required_overview_facts = [
              f"GOVERNED%20REPOSITORIES-{expected_counts['governed']}",
              f"**Critical** | {expected_counts['critical']}",
              f"**Elevated** | {expected_counts['elevated']}",
              f"**Standard** | {expected_counts['standard']}",
              f"**Experimental** | {expected_counts['experimental']}",
              f"**L4 PURPLE** | {expected_counts['L4-PURPLE']}",
              f"**L3 RED** | {expected_counts['L3-RED']}",
              f"**L2 YELLOW** | {expected_counts['L2-YELLOW']}",
              f"**L1 GREEN** | {expected_counts['L1-GREEN']}",
          ]
          stale = [fact for fact in required_overview_facts if fact not in overview]
          if stale:
              raise SystemExit(
                  "Enterprise Overview is stale relative to public-safe estate summary: "
                  + "; ".join(stale)
              )

          print(
              "Validated DPN Enterprise control plane: "
              f"estate={expected_counts}; public_records={len(public_blocks)}; "
              "rulesets=E0/E1/E2/E3"
          )
          PY
