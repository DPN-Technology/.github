name: DPN Reusable Enterprise Security

on:
  workflow_call:
    inputs:
      run_dependency_review:
        description: Run GitHub dependency review for pull requests. Private/internal repositories require GitHub Code Security or Advanced Security.
        required: false
        type: boolean
        default: true
      dependency_fail_severity:
        description: Minimum vulnerability severity that fails dependency review.
        required: false
        type: string
        default: high
      run_scorecard:
        description: Run OpenSSF Scorecard on non-PR events.
        required: false
        type: boolean
        default: false
      upload_scorecard_sarif:
        description: Upload Scorecard SARIF to GitHub code scanning. Requires code scanning support.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: ${{ inputs.run_dependency_review && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dependency_fail_severity }}

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ inputs.run_scorecard && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF
        if: ${{ inputs.upload_scorecard_sarif }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif

      - name: Security evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "# DPN Enterprise Security Evidence"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Scorecard SARIF upload: \`${{ inputs.upload_scorecard_sarif }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
